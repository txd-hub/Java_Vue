# ============================================
# Spring Boot 配置文件
# ============================================

# 服务端口配置
server:
  port: 8080
  address: 0.0.0.0

# Spring配置
spring:
  # 激活的配置环境（dev / prod）
  profiles:
    active: dev

  # 应用名称
  application:
    name: demo-admin

  # 数据源配置（MySQL 8.0）
  datasource:
    # 数据库驱动
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 数据库连接URL（使用demo_admin数据库）
    url: jdbc:mysql://localhost:3306/demo_admin?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    # 数据库用户名
    username: root
    # 数据库密码
    password: '123456'

    # Druid数据库连接池配置（必须在 spring.datasource 下）
    druid:
      # 初始连接数
      initial-size: 5
      # 最小空闲连接数
      min-idle: 5
      # 最大连接数
      max-active: 20
      # 获取连接最大等待时间（毫秒）
      max-wait: 60000
      # 是否开启监控统计
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*

  # Redis 配置
  data:
    redis:
      # Redis 服务器地址（本地或 Docker 容器）
      host: localhost
      # Redis 端口
      port: 6379
      # Redis 密码（无密码留空）
      password:
      # 数据库索引（默认0）
      database: 0
      # 连接超时时间
      timeout: 5000ms
      # 是否启用 Redis 缓存（设为 false 可跳过 Redis）
      enabled: true
      # Lettuce 连接池配置
      lettuce:
        pool:
          # 最大活跃连接数
          max-active: 8
          # 最大空闲连接数
          max-idle: 8
          # 最小空闲连接数
          min-idle: 0
          # 获取连接最大等待时间
          max-wait: -1ms

  # Jackson序列化配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

# MyBatis-Plus配置
mybatis-plus:
  # Mapper XML文件位置
  mapper-locations: classpath:mapper/**/*.xml
  # 实体类包扫描路径
  type-aliases-package: com.example.demo.entity
  configuration:
    # 开启驼峰命名自动映射
    map-underscore-to-camel-case: true
    # 控制台打印SQL（开发环境开启，生产环境关闭）
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      # 逻辑删除字段
      logic-delete-field: deleted
      # 逻辑删除值
      logic-delete-value: 1
      # 逻辑未删除值
      logic-not-delete-value: 0

# Sa-Token配置
sa-token:
  # token名称（同时也是cookie名称）
  token-name: Authorization
  # token有效期（秒），默认30天
  timeout: 2592000
  # token临时有效期（活跃超时时间）
  active-timeout: 1800
  # 是否允许同一账号并发登录
  is-concurrent: true
  # token风格：uuid/simple-uuid/random-32/random-64/random-128/tik
  token-style: uuid
  # 是否输出操作日志
  is-log: false

# Knife4j接口文档配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

# Knife4j增强配置
knife4j:
  enable: true
  setting:
    language: zh_cn